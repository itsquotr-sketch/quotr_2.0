plugins {
    id "com.android.application"
}

// Production Android host. Not the website and not a Preview alias.
def twaHost = "play.get-quotr.com"
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace "com.getquotr.app"
    compileSdk 36

    defaultConfig {
        applicationId "com.getquotr.app"
        minSdk 26
        targetSdk 36
        versionCode 2
        versionName "0.1.1"
        manifestPlaceholders = [
            twaHost: twaHost,
            twaDefaultUrl: "https://${twaHost}/login"
        ]
        resValue "string", "asset_statements", "[{\"relation\":[\"delegate_permission/common.handle_all_urls\"],\"target\":{\"namespace\":\"web\",\"site\":\"https://${twaHost}\"}}]"
    }

    signingConfigs {
        upload {
            if (keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties["storeFile"])
                storePassword keystoreProperties["storePassword"]
                keyAlias keystoreProperties["keyAlias"]
                keyPassword keystoreProperties["keyPassword"]
            }
        }
    }

    buildTypes {
        debug {
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.upload
            }
        }
        release {
            minifyEnabled false
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.upload
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "com.google.androidbrowserhelper:androidbrowserhelper:2.7.4"
}
