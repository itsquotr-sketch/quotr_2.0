<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Quotr is offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #fff;
        color: #1c1917;
        font: 16px/1.5 system-ui, sans-serif;
      }
      main {
        max-width: 28rem;
        padding: 2rem;
      }
      h1 {
        font-size: 1.25rem;
        margin: 0 0 0.5rem;
      }
      p {
        margin: 0;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Quotr cannot reach the server</h1>
      <p>
        The connection dropped before this page could open. Work that did not
        finish saving is still unsaved. Reconnect, then open the page again.
      </p>
    </main>
  </body>
</html>
